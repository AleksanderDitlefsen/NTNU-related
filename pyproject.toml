[project]
name = "ntnu-related"
version = "0.1.0"
description = "Code in relation to classes at NTNU Trondheim"
readme = "README.md"
authors = [
    { name = "Aleksander Ditlefsen", email = "232621479+AleksanderDitlefsen@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
]

[project.scripts]
ntnu-related = "ntnu_related:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
